name: CI
on:
  push:
  workflow_dispatch:
jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Application build started"
          mkdir -p build
          echo "Hello from GitHub Actions" > build/result.txt
          echo "Build completed"
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
  test-app:
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - run: |
          echo "Testing the build output"
          cat build/result.txt
          echo "Test completed"
      - run: exit 1 
  deploy-app:
    needs: test-app
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Deployment stage"
          echo "Application is ready to deploy"
